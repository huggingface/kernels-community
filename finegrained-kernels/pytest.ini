[pytest]

# collect only the suite — the repo root carries standalone bench/experiment scripts whose
# names can match pytest's default globs
testpaths = tests

# a free worker (= a free GPU, see conftest) takes the next pending test; xdist's default `load`
# scheduler pre-assigns chunks and splits the tail evenly, leaving GPUs idle behind one slow tune
addopts = --dist worksteal

markers =
    kernels_ci: mark test to run in kernels CI environment
    benchmark: mark test as a performance benchmark (run with -s to see timings)
    slow: long-running test (multi-process determinism checks, the forced-config sweep); deselect with -m "not slow"
