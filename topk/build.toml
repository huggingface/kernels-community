[general]
name = "topk"
version = 1
edition = 6
license = "MIT"
backends = ["metal"]

[general.hub]
repo-id = "transformers-community/topk"

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[kernel.topk_metal]
language = "cpp-metal"
depends = ["torch"]
include = [
    "topk_metal",
    "torch-ext",
]
src = [
    "topk_metal/topk_metal.cpp",
    "topk_metal/dispatch.mm",
    "topk_metal/common.h",
    "topk_metal/top_k.metal",
]
