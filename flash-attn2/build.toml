[general]
name = "flash-attn2"
version = 4
edition = 6
license = "BSD-3-Clause"
backends = [
    "cpu",
    "cuda",
    "xpu",
]

[general.hub]
repo-id = "kernels-community/flash-attn2"

# The Xe35 (CRI) paged-decode and chunk-prefill kernels run with 512 GRF
# (flash_attn_xpu/src/decode/grf_mode.hpp).
[general.xpu]
cri-grf-size = 512

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding_stable.cpp",
    "torch-ext/torch_binding.h",
]

[torch.stable-abi]
cuda = "2.10"
rocm = "2.10"

[kernel.flash_attn_cpu]
language = "cpp-cpu"
cxx-flags = ["-fopenmp"]
depends = ["torch"]
include = ["flash_attn_cpu"]
src = [
    "flash_attn_cpu/flash_api.cpp",
    "flash_attn_cpu/src/fmha_fwd_dispatch.cpp",
    "flash_attn_cpu/src/fmha_fwd_fallback.cpp",
    "flash_attn_cpu/src/fmha_fwd.hpp",
    "flash_attn_cpu/src/fmha_fwd_common.hpp",
    "flash_attn_cpu/src/fmha_fwd_kernel.hpp",
    "flash_attn_cpu/src/fmha_fwd_avx512.hpp",
    "flash_attn_cpu/src/fmha_fwd_fallback.hpp",
    "flash_attn_cpu/src/cpu_features.hpp",
]

[kernel.flash_attn]
language = "cpp-cuda"
cuda-capabilities = [
    "8.0",
    "9.0",
    "10.0",
    "12.0",
]
