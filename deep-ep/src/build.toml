[general]
name = "deep-ep"
version = 1
edition = 6
license = "MIT"
upstream = "https://github.com/deepseek-ai/DeepEP"
backends = ["cuda"]

[general.cuda]
minver = "13.0"

[general.hub]
repo-id = "kernels-community/deep-ep"

[torch]
cxx-flags = ["-std=c++20", "-DDEEP_EP_KERNELS", "-Wno-deprecated-declarations", "-Wno-unused-variable", "-Wno-sign-compare", "-Wno-reorder", "-Wno-attributes"]
pyext = [
    "py",
    "cuh",
]
include = ["torch-ext", "torch-ext/compat", "csrc", "deep_ep/include", "third-party/deep_jit/include", "third-party/nccl/include"]
src = [
    "torch-ext/deep_ep_holders.hpp",
    "torch-ext/torch_binding.cpp",
]

[kernel.deep_ep]
language = "cpp-cuda"
cxx-flags = [
    "-std=c++20",
    "-O3",
    "-DDEEP_EP_KERNELS",
    "-Wno-deprecated-declarations",
    "-Wno-unused-variable",
    "-Wno-sign-compare",
    "-Wno-reorder",
    "-Wno-attributes",
]
cuda-capabilities = ["9.0a", "10.0a"]
depends = ["torch"]
include = ["torch-ext/compat", "csrc", "deep_ep/include", "third-party/deep_jit/include", "third-party/nccl/include"]
