# `vendor/` is a pinned subset of MLX (revision in vendor/UPSTREAM); refresh it with
# `python vendor.py --rev <tag>`. It holds upstream's Metal kernels as they ship -- no local copy is
# generated from them. The host dispatch in mlx_metal/ is transcribed from upstream's quantized.cpp,
# which tests/test_vendor_drift.py checks on every pin bump.

[general]
name = "mlx-quantization-metal-kernels"
version = 1
edition = 5
license = "MIT"
backends = ["metal"]

[general.hub]
repo-id = "kernels-community/mlx-quantization-metal-kernels"

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[kernel.mlx_quantization_metal_kernels]
backend = "metal"
depends = ["torch"]
# quantized.metal includes "mlx/backend/metal/kernels/...", which resolves from vendor/.
include = ["torch-ext", "vendor"]
src = [
    "mlx_metal/mlx_dispatch.mm",
    # upstream's quantized.metal (vendored as quantized.metal.h, see vendor.py), compiled under
    # MLX's math mode
    "mlx_metal/mlx_quantized.metal",
    "vendor/mlx/backend/metal/kernels/quantized.metal.h",
    # upstream's reduce.metal, the same way: split-K sums its partial products with it
    "mlx_metal/mlx_reduce.metal",
    "vendor/mlx/backend/metal/kernels/reduce.metal.h",
    "vendor/mlx/backend/metal/kernels/reduce.h",
    "vendor/mlx/backend/metal/kernels/atomic.h",
    "vendor/mlx/backend/metal/kernels/reduction/ops.h",
    "vendor/mlx/backend/metal/kernels/reduction/reduce_all.h",
    "vendor/mlx/backend/metal/kernels/reduction/reduce_col.h",
    "vendor/mlx/backend/metal/kernels/reduction/reduce_init.h",
    "vendor/mlx/backend/metal/kernels/reduction/reduce_row.h",
    "vendor/mlx/backend/metal/kernels/quantized.h",
    "vendor/mlx/backend/metal/kernels/quantized_utils.h",
    "vendor/mlx/backend/metal/kernels/utils.h",
    "vendor/mlx/backend/metal/kernels/bf16.h",
    "vendor/mlx/backend/metal/kernels/bf16_math.h",
    "vendor/mlx/backend/metal/kernels/complex.h",
    "vendor/mlx/backend/metal/kernels/defines.h",
    "vendor/mlx/backend/metal/kernels/logging.h",
    "vendor/mlx/backend/metal/kernels/steel/defines.h",
    "vendor/mlx/backend/metal/kernels/steel/utils.h",
    "vendor/mlx/backend/metal/kernels/steel/utils/integral_constant.h",
    "vendor/mlx/backend/metal/kernels/steel/utils/type_traits.h",
    "vendor/mlx/backend/metal/kernels/steel/gemm/gemm.h",
    "vendor/mlx/backend/metal/kernels/steel/gemm/loader.h",
    "vendor/mlx/backend/metal/kernels/steel/gemm/mma.h",
    "vendor/mlx/backend/metal/kernels/steel/gemm/params.h",
    "vendor/mlx/backend/metal/kernels/steel/gemm/transforms.h",
]
