name: Check Ports

# A ported kernel's <kernel>/src is generated from <kernel>/port/port.kdl and
# committed. Regenerate it here and fail if the two disagree: a stale overlay
# reverting an in-tree fix, a hand-edited build.toml field the manifest op
# drops, an overlay file edited without its generated twin, or a recipe edited
# without rerunning the port (src/port-provenance.json records the recipe hash,
# so that case shows up as a diff in the provenance file).
#
# Pull requests only check the ports they touch; pushes to main and manual
# runs check every port.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "*/port/**"
      - "*/src/**"
      - "scripts/check_ports.py"
      - ".github/workflows/check-ports.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-ports:
    name: Check ports reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Each recipe pins its own upstream commit; the runner verifies the
      # origin URL, HEAD and cleanliness of the checkout it is handed.
      - name: Regenerate every port and compare
        env:
          # kernel-port is experimental upstream (no CLI or op stability
          # guarantee), so pin a huggingface/kernels main rev rather than
          # tracking the branch: a push there cannot break every open PR, and
          # bumping the pin is an explicit PR that re-checks every port.
          KERNEL_PORT: "nix run github:huggingface/kernels/ca9095966486b76168115a34e2027c6c98805919#kernel-port --"
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/check_ports.py --changed-since "$BASE_REF"
          else
            python3 scripts/check_ports.py
          fi
