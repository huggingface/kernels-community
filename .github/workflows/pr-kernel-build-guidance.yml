name: Kernel build guidance

on:
  # Runs in the untrusted PR context with a read-only token so no secrets or
  # write access are exposed. Only base-ref code is checked out and executed.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]


concurrency:
  group: pr-kernel-build-guidance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    name: Comment with build instructions
    if: github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      # Do not check out the PR head: pull_request_target has a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comment when a non-owner changes kernel source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Validate PR_NUMBER is numeric to prevent injection
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid PR number"
            exit 1
          fi
          python3 .github/scripts/pr_kernel_build_guidance.py
