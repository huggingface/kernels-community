name: Kernel build guidance

on:
  # Run in the trusted base-repository context so fork PRs can receive a
  # comment. The workflow only checks out and executes code from the base ref.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-kernel-build-guidance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Comment with build instructions
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      # Do not check out the PR head: pull_request_target has a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comment when an external contributor changes kernel source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_kernel_build_guidance.py
