name: PR Comment Build Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  handle-comment:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    outputs:
      autotune_request: ${{ steps.command.outputs.autotune_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Fetch PR head for metadata
        # Make the PR commit available so the bot can read its build.toml (data only).
        run: git fetch --depth=1 origin "refs/pull/${{ github.event.issue.number }}/head"
      - name: Handle /kernel-bot command
        id: command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only org token, used *solely* to look up team membership so
          # `/kernel-bot build` also works for the huggingface/transformers team.
          # GITHUB_TOKEN is repo-scoped and cannot read team rosters. If this
          # secret is unset the bot falls back to repo-permission checks alone.
          TEAM_READ_TOKEN: ${{ secrets.TEAM_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_SENDER_TYPE: ${{ github.event.sender.type }}
          COMMENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          # People sometimes add newlines (Unix or Windows). Trim trailing
          # whitespace (including \r and \n) so that it does not fail the
          # validation. Only the end is trimmed, like Python's strip().
          COMMENT_BODY="${COMMENT_BODY%"${COMMENT_BODY##*[![:space:]]}"}"
          if [ "${#COMMENT_BODY}" -gt 1024 ]; then
            echo "Ignoring oversized comment payload."
            exit 0
          fi
          case "$COMMENT_BODY" in
            /kernel-bot*) ;;
            *)
              echo "Ignoring non /kernel-bot comment."
              exit 0
              ;;
          esac
          if ! printf '%s' "$COMMENT_BODY" | grep -Eq '^/kernel-bot[][ A-Za-z0-9_,./-]*$'; then
            echo "::warning::Ignoring /kernel-bot comment with unsupported characters."
            exit 0
          fi
          if [[ "$COMMENT_AUTHOR_ASSOCIATION" != "MEMBER" && "$COMMENT_AUTHOR_ASSOCIATION" != "OWNER" && "$COMMENT_AUTHOR_ASSOCIATION" != "COLLABORATOR" ]]; then
            echo "Unauthorized: Only members, owners, and collaborators can use /kernel-bot."
            exit 1
          fi
          python3 .github/scripts/pr_comment_kernel_bot.py

  wait-for-builds:
    needs: handle-comment
    if: needs.handle-comment.outputs.autotune_request != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      request: ${{ steps.wait.outputs.request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Wait for every dispatched build and upload
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOTUNE_REQUEST: ${{ needs.handle-comment.outputs.autotune_request }}
        run: python3 .github/scripts/wait_for_autotune_builds.py

  autotune:
    needs: wait-for-builds
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/autotune.yaml
    with:
      request: ${{ needs.wait-for-builds.outputs.request }}
