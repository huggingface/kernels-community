name: Check Public API

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - "scripts/**"
      - "*.json"
      - "*.nix"
      - "*.lock"
      - ".gitignore"
      - ".gitmodules"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


permissions: {}

jobs:
  check-public-api:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        run: pip install uv

      # Ports without a committed src tree are generated to read their API.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check public API
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Keep in sync with check-ports.yaml.
          KERNEL_PORT: "nix run --refresh github:huggingface/kernels/kernel-port-srcless#kernel-port --"
        run: |
          uv run --script scripts/check_public_api.py --base-ref "$BASE_SHA"
