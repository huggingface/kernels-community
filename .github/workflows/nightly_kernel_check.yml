name: Scheduled Kernels Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  kernels-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/huggingface/kernels#subdirectory=kernels"

      - name: Install kernel-builder
        # ABI checks now live in `kernel-builder check-abi`; install the binary
        # from the kernels repository so it is available on PATH.
        run: cargo install --git https://github.com/huggingface/kernels hf-kernel-builder

      - name: Run kernels checks and report failures
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/report_kernel_failures.py --verbose --clear-cache --results-json "$RUNNER_TEMP/abi-results.json"

      # Runs even when the ABI check fails, so the failures land in the snapshot.
      - name: Publish kernel-status snapshot
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ABI_ARGS=""
          if [ -f "$RUNNER_TEMP/abi-results.json" ]; then
            ABI_ARGS="--abi-results $RUNNER_TEMP/abi-results.json"
          fi
          python scripts/kernel_status_snapshot.py $ABI_ARGS --upload
