[package]
name = "kernel-status"
version = "0.1.0"
edition = "2021"
description = "Audit the health of every kernel from the kernel-status dataset"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
ureq = "2"

[profile.release]
strip = true
