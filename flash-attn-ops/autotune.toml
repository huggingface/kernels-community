command = ["python", "autotune.py"]
# Source directory packaged as configs/ in each build variant.
configs = "torch-ext/flash_attn_ops/configs"

[[targets]]
name = "l4"
gpu = "NVIDIA L4"
runner = "aws-g6-12xlarge-plus"
backend = "cuda"

# Keep the matrix bounded for the workflow's 60-minute GPU job. The row count
# is fixed because it is not part of the Triton autotuning keys.
[workloads]
rows = 512
dtypes = ["bfloat16"]
hidden_sizes = [1024, 2048, 4096, 8192]
# Fused prenorm cases use residuals with the same dtype as the inputs.
residual_hidden_sizes = [1024, 2048, 4096, 8192]
