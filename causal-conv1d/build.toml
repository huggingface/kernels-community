[general]
name = "causal-conv1d"
version = 3
edition = 6
license = "BSD-3-Clause"
backends = [
    "cuda",
    "rocm",
    "xpu",
]

[general.hub]
repo-id = "kernels-community/causal-conv1d"

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[torch.stable-abi]
cuda = "2.10"
rocm = "2.10"
xpu = "2.13"

[kernel.causal_conv1d_xpu]
language = "cpp-xpu"
depends = ["torch"]
include = ["causal-conv1d-xpu"]
src = [
    "causal-conv1d-xpu/causal_conv1d_xpu_bwd.cpp",
    "causal-conv1d-xpu/causal_conv1d_xpu_common.hpp",
    "causal-conv1d-xpu/causal_conv1d_xpu_fwd.cpp",
    "causal-conv1d-xpu/causal_conv1d_xpu.hpp",
    "causal-conv1d-xpu/causal_conv1d_xpu_update.cpp",
]

[kernel.causal_conv1d]
language = "cpp-cuda"
depends = ["torch"]
include = ["causal-conv1d"]
src = [
    "causal-conv1d/causal_conv1d_bwd.cu",
    "causal-conv1d/causal_conv1d_common.h",
    "causal-conv1d/causal_conv1d.cpp",
    "causal-conv1d/causal_conv1d_fwd.cu",
    "causal-conv1d/causal_conv1d.h",
    "causal-conv1d/causal_conv1d_update.cu",
    "causal-conv1d/static_switch.h",
]

[kernel.causal_conv1d_rocm]
language = "cpp-rocm"
depends = ["torch"]
rocm-archs = [
    "gfx906",
    "gfx908",
    "gfx90a",
    "gfx940",
    "gfx941",
    "gfx942",
    "gfx950",
    "gfx1030",
    "gfx1100",
    "gfx1101",
    "gfx1102",
    "gfx1103",
    "gfx1150",
    "gfx1151",
    "gfx1200",
    "gfx1201",
]
include = ["causal-conv1d"]
src = [
    "causal-conv1d/causal_conv1d_bwd.cu",
    "causal-conv1d/causal_conv1d_common.h",
    "causal-conv1d/causal_conv1d.cpp",
    "causal-conv1d/causal_conv1d_fwd.cu",
    "causal-conv1d/causal_conv1d.h",
    "causal-conv1d/causal_conv1d_update.cu",
    "causal-conv1d/static_switch.h",
]
