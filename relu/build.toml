[general]
name = "relu"
version = 1
edition = 6
license = "Apache-2.0"
backends = [
    "cpu",
    "cuda",
    "metal",
    "rocm",
    "xpu",
]

[general.hub]
repo-id = "kernels-community/relu"

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[kernel.activation_metal]
language = "cpp-metal"
depends = ["torch"]
src = [
    "relu_metal/relu.mm",
    "relu_metal/relu.metal",
    "relu_metal/common.h",
]

[kernel.activation_rocm]
language = "cpp-rocm"
depends = ["torch"]
rocm-archs = [
    "gfx906",
    "gfx908",
    "gfx90a",
    "gfx940",
    "gfx941",
    "gfx942",
    "gfx1030",
    "gfx1100",
    "gfx1101",
]
src = ["relu_cuda/relu.cu"]

[kernel.relu_cpu]
language = "cpp-cpu"
depends = ["torch"]
src = ["relu_cpu/relu_cpu.cpp"]

[kernel.activation_xpu]
language = "cpp-xpu"
depends = ["torch"]
src = ["relu_xpu/relu.cpp"]

[kernel.activation]
language = "cpp-cuda"
depends = ["torch"]
src = ["relu_cuda/relu.cu"]
